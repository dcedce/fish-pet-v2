name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.2'   # 与 AGP 8.2.2 匹配

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Show failure reason
        if: failure()
        run: |
          echo "===== What went wrong ====="
          awk '/\* What went wrong/,/\* Try/' build.log | head -100
          grep -nE 'error:|Caused by|Could not|not found' build.log | head -40

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fish-pet-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
